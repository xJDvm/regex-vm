<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive playground for regex-vm, a regular-expression engine with linear-time matching." />
    <title>regex-vm playground</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="app">
      <header class="masthead">
        <h1>regex-vm <span>playground</span></h1>
        <p>Pattern to AST to bytecode to Pike VM, with every step checked against the native <code>RegExp</code>.</p>
      </header>

      <div class="layout">
        <section class="panel wide" aria-label="Input">
          <div id="presets" class="presets" role="group" aria-label="Presets"></div>
          <label class="field">
            <span class="label">Pattern</span>
            <input
              id="pattern"
              data-testid="pattern"
              type="text"
              maxlength="10000"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
            />
          </label>
          <label class="field">
            <span class="label">Input <span id="counter" class="counter"></span></span>
            <input
              id="test-input"
              data-testid="input"
              type="text"
              maxlength="200"
              spellcheck="false"
              autocomplete="off"
              autocapitalize="off"
            />
          </label>
        </section>

        <section id="error" class="panel error wide" data-testid="error" hidden></section>

        <section class="panel" aria-labelledby="bytecode-title">
          <h2 id="bytecode-title">Bytecode</h2>
          <ol id="bytecode" class="bytecode"></ol>
        </section>

        <section class="panel" aria-labelledby="captures-title">
          <h2 id="captures-title">Captures</h2>
          <div class="scroll">
            <table>
              <thead>
                <tr>
                  <th scope="col">Group</th>
                  <th scope="col">Span</th>
                  <th scope="col">Text</th>
                </tr>
              </thead>
              <tbody id="captures"></tbody>
            </table>
          </div>
        </section>

        <section class="panel wide" aria-labelledby="result-title">
          <h2 id="result-title">Result</h2>
          <div class="results">
            <div>
              <h3>regex-vm</h3>
              <p id="match-result" data-testid="match-result"></p>
            </div>
            <div>
              <h3>Native RegExp</h3>
              <p id="native-result" data-testid="native-result"></p>
            </div>
          </div>
          <p id="verdict" class="verdict"></p>
        </section>
      </div>
    </main>
  </body>
</html>
